{% extends "base.html" %}

{% block title %}Login - Jogoteca{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock text-primary display-4"></i>
                    <h3 class="fw-bold mt-2">Acesse sua Conta</h3>
                    <p class="text-muted small">Sistema seguro com autenticação protegida</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="login" class="form-label">Usuário / Login</label>
                        <input type="text" class="form-control" id="login" name="login" value="{{ login or '' }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
