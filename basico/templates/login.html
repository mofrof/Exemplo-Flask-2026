<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% with mensagensErro = get_flashed_messages() %}
        <p style="color:red">{{mensagensErro[0]}}</p>
    {% endwith %}
    <form action="{{url_for('paginaLogin')}}" method="post">
        <label for="login">Login:</label>
        <input type="text" name="login" id="login">
        <label for="senha">Senha</label>
        <input type="password" name="Manga" id="senha">
        <button>Enviar</button>
    </form>

</body>
</html>
